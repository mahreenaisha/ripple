# Knowledge a new engineer needs that the call graph alone does not show.
# Every fact must be backed by something in the repo (a doc, config, or code)
# and name where it came from.
# applies_to matches flows by trigger label/message type, step class or symbol,
# a data store or external system the flow touches, or a flow category.
schema_version: 1
repo: DeviceAS

facts:
  - id: heartbeat-purpose
    kind: doc
    title: Why the heartbeat exists
    text: >-
      Edge devices prove they are alive by checking in. Each acquisition controller
      stores NextHeartbeat, the time it is next expected to report, and HeartbeatError,
      which is true when it has not proven alive within the expected window. The
      heartbeat job is how DeviceAS notices controllers that went quiet: HeartbeatValidator
      flags controllers whose NextHeartbeat has passed, marks HeartbeatError, and enqueues
      a ControllerHeartbeatErrorMessage so their systems are updated. The same pass also
      renews and deletes certificates, and syncs reservations and edge deployments.
    applies_to:
      triggers: [TenancyDevicesHeartbeat, ControllerHeartbeatErrorMessage]
    source:
      type: doc
      path: docs/design/opensearch-data-model-design.md
      line: 385
    verified: true

  - id: tenancy-data-isolation
    kind: rule
    title: Tenancy data isolation (TDI) applies to OpenSearch
    text: >-
      Every persisted document carries a TenantId keyword field, and every document id
      must be prefixed with the tenant id. Tenant reads and writes go through the
      tenant-data route, authenticated as the per-tenant OpenSearch service user that
      TenancyAS provisions. Entities are expected to be reached via this route in
      production.
    applies_to:
      boundaries: [OpenSearch]
    source:
      type: doc
      path: docs/design/opensearch-data-model-design.md
      line: 737
    verified: true

terms:
  Scalars Access: >-
    Waters' web product, hosted at *.scalars-access.com, where users view lab devices
    in Lab Monitor. DeviceAS builds links into its system, controller, and reservation
    pages. It is not a store of scalar values.
  TDI: >-
    Tenancy data isolation. The platform rule that keeps each tenant's OpenSearch data
    separate, enforced by per-tenant service users and tenant-prefixed document ids.
  heartbeat: >-
    A periodic proof-of-life check. Devices report on a schedule, and a missed report
    means the device may be offline or broken.
