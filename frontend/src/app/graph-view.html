<div #cyContainer class="canvas"></div>

<aside class="legend">
  <p class="legend-title">How to read this</p>
  <ul>
    <li>
      <span class="swatch sizes" aria-hidden="true"><i class="dot sm"></i><i class="dot lg"></i></span>
      <span><strong>Size</strong> — incoming call volume</span>
    </li>
    <li>
      <span class="swatch gradient" aria-hidden="true"></span>
      <span><strong>Colour</strong> — average error rate, green to red</span>
    </li>
    <li>
      <span class="swatch" aria-hidden="true"><i class="dot ring"></i></span>
      <span><strong>Orange ring</strong> — 4+ callers, a likely single point of failure</span>
    </li>
  </ul>
  <p class="legend-hint">Click a node to focus its neighbours, click the background to reset. Drag to move, scroll to zoom.</p>
</aside>
